name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            targets: "ReaperianiBass_VST3"
          - os: windows-2022
            platform: windows-x86_64
            targets: "ReaperianiBass_VST3"
          - os: macos-15
            platform: macos-universal
            targets: "ReaperianiBass_VST3 ReaperianiBass_AU"

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libgtk-3-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxext-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: |
          if [[ "${{ matrix.platform }}" == "macos-universal" ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          fi

      - name: Build plugin formats and DSP tests
        run: cmake --build build --config Release --parallel 2 --target ReaperianiBassDSPTests ${{ matrix.targets }}

      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test release packaging
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Package plugin formats
        run: python scripts/package.py --build-dir build --output-dir dist --platform "${{ matrix.platform }}"

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v4
        with:
          name: ReaperianiBass-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "ReaperianiBass $GITHUB_REF_NAME" --generate-notes
